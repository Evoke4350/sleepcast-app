apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    // With the `dist` flavor dimension, debug variants are named fullDebug /
    // fossDebug (not plain "debug"), so they must be listed here or the plugin
    // embeds a JS bundle instead of loading from Metro — breaking the dev loop.
    debuggableVariants = ["fullDebug", "fossDebug"]

    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    externalNativeBuild {
        cmake {
            path "src/main/jni/CMakeLists.txt"
        }
    }

    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.sleepcastapp"
    defaultConfig {
        applicationId "com.sleepcastapp"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Caution! In production, you need to generate your own keystore file.
            // see https://reactnative.dev/docs/signed-apk-android.
            signingConfig signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }

    // Distribution flavors. `full` is the default build (unchanged). `foss` is
    // the F-Droid build: same code minus YouTube, with a pure-JS varied-mix and
    // no prebuilt onnxruntime binary or MiniLM model (the metro resolver swaps
    // the JS; the onnxruntime .so is stripped below). Side-by-side package id so
    // both install together. See docs/specs/2026-08-06-fdroid-flavor-design.md.
    flavorDimensions "dist"
    productFlavors {
        full {
            dimension "dist"
            // default package id (com.sleepcastapp) — unchanged
        }
        foss {
            dimension "dist"
            applicationIdSuffix ".foss"
            versionNameSuffix "-foss"
        }
    }
}

// The foss flavor must ship no prebuilt onnxruntime binary. onnxruntime-react-
// native pulls a prebuilt onnxruntime-android aar whose libonnxruntime.so is the
// F-Droid blocker (Microsoft's prebuilt ORT), alongside the built-from-source
// libonnxruntimejsi.so JSI glue. Strip all onnxruntime .so from the foss APK.
// foss's JS never imports onnxruntime (embed swapped to the pure-JS embedder), so
// the TurboModule is never instantiated and no .so is ever dlopen'd — the strip
// leaves no dangling load. full keeps them.
androidComponents {
    onVariants(selector().withFlavor("dist", "foss")) { variant ->
        variant.packaging.jniLibs.excludes.add("**/libonnxruntime*.so")
    }
}

// Ensure the foss variants' embedded JS bundle runs Metro with the FOSS swap, so
// the packaged bundle uses the pure-JS embedder + YouTube stub (no onnxruntime,
// no 23 MB model). RN 0.86's BundleHermesCTask is a plain DefaultTask that shells
// out via ExecOperations.exec inheriting the daemon env — it exposes no way to set
// a per-task env directly. But it DOES expose `nodeExecutableAndArgs`, which is
// prepended to the bundle command line. Wrapping it in `env SLEEPCAST_FOSS=1`
// makes the command literally `env SLEEPCAST_FOSS=1 node cli.js bundle …`, so the
// resolver swap fires WITHOUT needing a `SLEEPCAST_FOSS=1 ./gradlew` prefix.
// `env` is present on every Linux/macOS build host (incl. F-Droid's).
afterEvaluate {
    tasks.matching { it.name =~ /^createBundleFoss.*JsAndAssets$/ }.configureEach { t ->
        def base = t.nodeExecutableAndArgs.getOrElse(["node"])
        t.nodeExecutableAndArgs.set(["env", "SLEEPCAST_FOSS=1"] + base)
        // Metro's --assets-dest never deletes orphaned assets, so an incremental
        // rebuild after the swap changed would leave a stale model.onnx in the
        // output and package it. Clear the bundle/asset output dirs first so each
        // foss bundle reflects only the current (swapped) module graph.
        t.doFirst {
            t.jsBundleDir.get().asFile.deleteDir()
            t.resourcesDir.get().asFile.deleteDir()
        }
    }
}

// Fail-closed guard: if the swap ever silently fails to apply, the foss embedded
// bundle would pull in the full JS — dragging the 23 MB MiniLM model into the APK
// (AGP renames it, e.g. res/yt.onnx, so a filename grep is not enough) and
// referencing onnxruntime. Verify every packaged foss bundle asset dir and FAIL
// the build if any onnxruntime .onnx model (a large .onnx) is present. Cheap
// insurance against a forgotten env / a plugin change reopening the hole.
afterEvaluate {
    tasks.matching { it.name =~ /^createBundleFoss.*JsAndAssets$/ }.configureEach { t ->
        t.doLast {
            [t.jsBundleDir.get().asFile, t.resourcesDir.get().asFile].each { root ->
                if (root.exists()) {
                    root.eachFileRecurse { f ->
                        if (f.isFile() && f.name.endsWith('.onnx') && f.length() > 1_000_000) {
                            throw new GradleException(
                                "FOSS build guard: a large .onnx model (${f.length()} bytes at ${f}) " +
                                "was packaged by ${t.name} — the SLEEPCAST_FOSS resolver swap did NOT apply. " +
                                "The foss APK must ship no ML model. Check metro-foss-resolve.js / the env wrapper.")
                        }
                    }
                }
            }
        }
    }
}

dependencies {
    // ExoPlayer. media3 rather than the old exoplayer2 artifacts, and
    // session/ is here now because the foreground service that makes
    // background playback survive needs it.
    implementation("androidx.media3:media3-exoplayer:1.4.1")
    implementation("androidx.media3:media3-session:1.4.1")

    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }

    testImplementation("junit:junit:4.13.2")
}
